<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ahlak Rehberim</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Ahlak Rehberim</h1>
  </header>

  <main class="container">
    <section class="controls">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Marka veya barkod ara...">
        <button id="scanBtn" class="btn-scan" type="button">📷 Tara</button>
      </div>

      <select id="categorySelect">
        <option value="all">Tüm Kategoriler</option>
      </select>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Tümü</button>
        <button class="filter-btn" data-filter="boycott">🔴 İnceleme / Boykot</button>
        <button class="filter-btn" data-filter="safe">🟢 Tercih Edilebilir</button>
        <button class="filter-btn" data-filter="alt">⭐ Alternatifli</button>
      </div>
    </section>

    <div id="scanner-box">
      <div id="reader"></div>
      <button id="closeScanBtn" class="btn-close-scan" type="button">Kamerayı Kapat</button>
    </div>

    <section id="brandGrid" class="grid">
      <p class="empty">Yükleniyor...</p>
    </section>
  </main>
</body>
</html>
