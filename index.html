<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ahlak Rehberim</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="stylesheet" href="style.css?v=8">
  <script src="https://unpkg.com" defer></script>
  <script src="app.js?v=8" defer></script>
</head>
<body>
  <header>
    <div class="brand-hero">
      <img src="icon-512.png" alt="Ahlak Rehberim Logo" class="app-logo">
      <div>
        <h1>AHLAK REHBERİM</h1>
        <p>Bilinçli Tüket, Doğru Tercih</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Marka, ana firma veya barkod ara..." autocomplete="off">
        <button id="openScanBtn" class="btn-scan" type="button">📷 Tara</button>
      </div>
      <div class="filter-row">
        <button class="pill active" data-filter="all">Tümü</button>
        <button class="pill" data-filter="review">🔴 İnceleme / Boykot</button>
        <button class="pill" data-filter="preferred">🟢 Tercih Edilebilir</button>
        <button class="pill" data-filter="alt">⭐ Alternatifli</button>
      </div>
      <select id="categorySelect"><option value="all">📂 Tüm Kategoriler</option></select>
    </section>

    <div id="scanner-box" hidden>
      <div id="reader"></div>
      <div class="manual-row">
        <input type="text" id="manualBarcode" placeholder="Barkod numarasını girin...">
        <button id="manualSearchBtn" class="btn-scan" type="button">Ara</button>
        <button id="closeScanBtn" class="btn-close" type="button">✕</button>
      </div>
    </div>

    <div id="countBar" class="count-bar"></div>
    <section id="brandGrid" class="grid"><p class="empty">Markalar yükleniyor...</p></section>
    <button id="loadMoreBtn" class="btn-more" hidden>Daha Fazla Göster</button>
  </main>
</body>
</html>
