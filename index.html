<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ahlak Rehberim</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #F4F6F8; color: #111827; }
    header { position: sticky; top: 0; z-index: 10; background: #1B4332; color: #fff; padding: 14px 16px; }
    header h1 { margin: 0 0 10px; font-size: 20px; }
    .bar { display: flex; gap: 8px; max-width: 820px; margin: 0 auto; }
    input { flex: 1; height: 44px; border: 0; border-radius: 12px; padding: 0 14px; font-size: 16px; outline: none; }
    select { height: 44px; border: 0; border-radius: 12px; padding: 0 10px; font-size: 14px; background: #fff; }
    main { max-width: 820px; margin: 0 auto; padding: 14px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; }
    .tabs button { border: 1px solid #D1D5DB; background: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .tabs button.active { background: #1B4332; color: #fff; border-color: #1B4332; }
    .info { font-size: 13px; color: #6B7280; font-weight: 700; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .card { background: #fff; border: 1px solid #E5E7EB; border-radius: 14px; padding: 14px; cursor: pointer; }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card h3 { margin: 0; font-size: 17px; }
    .badge { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
    .bad { background: #FEE2E2; color: #B91C1C; }
    .ok { background: #DCFCE7; color: #15803D; }
    .sub { font-size: 13px; color: #6B7280; margin-top: 4px; }
    .alt { font-size: 12px; color: #15803D; background: #F0FDF4; padding: 5px 8px; border-radius: 8px; margin-top: 6px; font-weight: 600; }
    dialog { width: min(500px, calc(100vw - 24px)); border: 0; border-radius: 18px; padding: 18px; }
    dialog::backdrop { background: rgba(0,0,0,0.5); }
  </style>
</head>
<body>
<header>
  <div style="max-width:820px;margin:0 auto;"><h1>Ahlak Rehberim</h1></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Marka, firma veya alternatif ara...">
    <select id="cat"><option value="">Tüm Kategoriler</option></select>
  </div>
</header>
<main>
  <div class="tabs" id="tabs">
    <button data-f="" class="active">Tümü</button>
    <button data-f="bad">🔴 İnceleme / Boykot</button>
    <button data-f="ok">🟢 Tercih Edilebilir</button>
    <button data-f="alt">⭐ Alternatifli</button>
  </div>
  <div class="info" id="count">Yükleniyor...</div>
  <div class="grid" id="list"></div>
</main>
<dialog id="dlg"></dialog>
<script>
let DATA = [], FILTER = '';
const SAFE = new Set(['eti','torku','ulker','sutas','pinar','dimes','tamek','uludag','caykur','didi','bingo','boron','peros','abc','mintax','asperox','camsil','parex','frosch','duru','dalan','dalin','eyup sabri tuncer','rosense','otaci','bioxcin','restorex','arko','derby','elit','melodi','patos','cipso','kahve dunyasi','farmasi','golden rose','pastel']);
const norm = s => String(s||'').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').trim();
const esc = s => String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const isOk = x => SAFE.has(norm(x.marka)) || /tercih|degil|preferred|safe/.test(norm(x.durum||x.status));
const getAlts = x => Array.isArray(x.alternatifler) ? x.alternatifler.map(a=>a.marka||a).filter(Boolean) : String(x.alternatif||'').split(/[;,]+/).map(s=>s.trim()).filter(s=>s&&s!=='.');

function render() {
  const q = norm(document.getElementById('q').value);
  const c = document.getElementById('cat').value;
  const res = DATA.filter(x => {
    const ok = isOk(x), alts = getAlts(x);
    if (FILTER === 'bad' && ok) return false;
    if (FILTER === 'ok' && !ok) return false;
    if (FILTER === 'alt' && !alts.length) return false;
    if (c && x.kategori !== c) return false;
    if (q && !x._s.includes(q)) return false;
    return true;
  });
  document.getElementById('count').textContent = `${res.length} / ${DATA.length} marka`;
  document.getElementById('list').innerHTML = res.slice(0, 80).map((x, i) => {
    const ok = isOk(x), alts = getAlts(x);
    return `<div class="card" onclick="show(${i})"><div class="card-top"><h3>${esc(x.marka)}</h3><span class="badge ${ok?'ok':'bad'}">${ok?'Tercih Edilebilir':'İnceleme'}</span></div>${x.anaFirma?`<div class="sub">${esc(x.anaFirma)}</div>`:''}${alts.length?`<div class="alt">✓ ${esc(alts.slice(0,3).join(', '))}</div>`:''}</div>`;
  }).join('') || '<p>Sonuç bulunamadı.</p>';
  window._RES = res;
}

function show(i) {
  const x = window._RES[i], alts = getAlts(x), dlg = document.getElementById('dlg');
  const srcs = (x.kaynaklar||[]).map(k => k.url ? `<p><a href="${esc(k.url)}" target="_blank">${esc(k.url)}</a></p>` : '').join('');
  dlg.innerHTML = `<button onclick="dlg.close()" style="float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;">✕</button><h2>${esc(x.marka)}</h2><p><b>Ana Firma:</b> ${esc(x.anaFirma||'-')}</p><p><b>Kategori:</b> ${esc(x.kategori||'-')}</p>${alts.length?`<p><b>Alternatifler:</b> ${esc(alts.join(', '))}</p>`:''}${srcs}`;
  dlg.showModal();
}

document.getElementById('q').oninput = render;
document.getElementById('cat').onchange = render;
document.getElementById('tabs').onclick = e => {
  if (!e.target.dataset.f && e.target.dataset.f !== '') return;
  FILTER = e.target.dataset.f;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b === e.target));
  render();
};

fetch('data.json?v=' + Date.now()).then(r => r.json()).then(raw => {
  const seen = new Set(), cats = new Set();
  (Array.isArray(raw) ? raw : []).forEach(x => {
    const m = String(x.marka||'').replace(/[:(]+$/g,'').trim();
    if (!m || seen.has(norm(m))) return;
    seen.add(norm(m));
    if (x.kategori) cats.add(x.kategori);
    x.marka = m;
    x._s = norm([m, x.anaFirma, x.kategori, getAlts(x).join(' ')].join(' '));
    DATA.push(x);
  });
  DATA.sort((a,b) => a.marka.localeCompare(b.marka, 'tr'));
  document.getElementById('cat').innerHTML += [...cats].sort().map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  render();
}).catch(() => document.getElementById('count').textContent = 'data.json yüklenemedi.');
</script>
</body>
</html>
