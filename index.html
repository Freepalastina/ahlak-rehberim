<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ahlak Rehberim</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="stylesheet" href="style.css?v=10">
  <script src="app.js?v=57" defer></script>

</head>
<body>
  <header>
        <div class="top-nav">
      <div class="lang-bar">
        <button class="lang-btn active" data-lang="tr">🇹🇷 TR</button>
        <button class="lang-btn" data-lang="de">🇩🇪 DE</button>
        <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
      </div>
      <button id="installBtn" class="lang-btn" type="button" hidden>📲 Yükle</button>
    </div>
    </div>
    <div class="brand-hero">
      <img src="icon-512.png" alt="Ahlak Rehberim" class="app-logo">
      <div>
        <h1>AHLAK REHBERİM</h1>
        <p id="subTitle">Bilinçli Tüket, Doğru Tercih</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Marka, ana firma veya barkod..." autocomplete="off">
        <button id="openScanBtn" class="btn-scan" type="button">📷 <span id="scanTxt">Tara</span></button>
      </div>
      <div class="filter-row">
        <button class="pill active" data-filter="all" id="fAll">Tümü</button>
        <button class="pill" data-filter="review" id="fRev">🔴 İnceleme</button>
        <button class="pill" data-filter="preferred" id="fPref">🟢 Tercih Edilebilir</button>
        <button class="pill" data-filter="alt" id="fAlt">⭐ Alternatifli</button>
      </div>
      <select id="categorySelect"><option value="all">📂 Tüm Kategoriler</option></select>
    </section>

    <div id="scanner-box" hidden>
      <div id="reader"></div>
      <div class="manual-row">
        <input type="text" id="manualBarcode" placeholder="Barkod numarası...">
        <button id="manualSearchBtn" class="btn-scan" type="button">OK</button>
        <button id="closeScanBtn" class="btn-close" type="button">✕</button>
      </div>
    </div>

    <div id="countBar" class="count-bar"></div>
    <section id="brandGrid" class="grid"><p class="empty">Yükleniyor...</p></section>
    <button id="loadMoreBtn" class="btn-more" hidden>Daha Fazla Göster</button>
  </main>
</body>
</html>
