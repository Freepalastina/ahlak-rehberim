<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B4332">
  <title>Ahlak Rehberim</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    :root {
      --bg: #F6F7F9;
      --surface: #FFFFFF;
      --surface-2: #F0F2F5;
      --text: #111827;
      --muted: #6B7280;
      --accent: #1B4332;
      --accent-2: #2D6A4F;
      --accent-soft: #ECFDF5;
      --accent-text: #065F46;
      --red: #DC2626;
      --red-soft: #FEF2F2;
      --amber: #D97706;
      --amber-soft: #FFFBEB;
      --line: #E5E7EB;
      --shadow: 0 2px 10px rgba(17, 24, 39, 0.05);
      --radius: 16px;
    }

    [data-theme="dark"] {
      --bg: #0F1412;
      --surface: #18201D;
      --surface-2: #222C28;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --accent: #2D6A4F;
      --accent-2: #40916C;
      --accent-soft: rgba(52, 211, 153, 0.14);
      --accent-text: #6EE7B7;
      --red: #F87171;
      --red-soft: rgba(248, 113, 113, 0.14);
      --amber: #FBBF24;
      --amber-soft: rgba(251, 191, 36, 0.14);
      --line: #28332E;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      line-height: 1.45;
      overscroll-behavior-y: none;
    }

    /* Moderner App-Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #FFFFFF;
      padding: calc(14px + env(safe-area-inset-top)) 16px 16px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .header-wrap {
      max-width: 880px;
      margin: 0 auto;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(6px);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 16px;
    }

    .logo-area h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo-area span {
      display: block;
      font-size: 11px;
      opacity: 0.85;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-pills {
      display: flex;
      gap: 3px;
      background: rgba(0, 0, 0, 0.2);
      padding: 3px;
      border-radius: 10px;
    }

    .lang-pills button {
      width: 30px;
      height: 28px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      font-size: 15px;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      opacity: 0.75;
    }

    .lang-pills button.active {
      background: #FFFFFF;
      opacity: 1;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .round-btn {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
      font-size: 15px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    #installBtn {
      height: 34px;
      padding: 0 11px;
      border: 0;
      border-radius: 10px;
      background: #FFFFFF;
      color: #1B4332;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    @media all and (display-mode: standalone) {
      #installBtn { display: none !important; }
    }

    /* Suchleiste */
    .search-group {
      display: flex;
      gap: 8px;
    }

    .search-field {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-field input {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 14px;
      padding: 0 38px 0 15px;
      background: var(--surface);
      color: var(--text);
      font-size: 16px;
      outline: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .search-field input::placeholder {
      color: var(--muted);
    }

    #clearBtn {
      position: absolute;
      right: 8px;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }

    #barcodeBtn {
      height: 46px;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Hauptbereich */
    .content {
      max-width: 880px;
      margin: 0 auto;
      padding: 14px 14px calc(44px + env(safe-area-inset-bottom));
    }

    /* Zähler-Leiste */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px 6px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-box b {
      display: block;
      font-size: 17px;
      font-weight: 800;
    }

    .stat-box span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 1px;
    }

    .stat-box.red b { color: var(--red); }
    .stat-box.green b { color: var(--accent-text); }

    /* Filter-Tabs */
    .filter-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }

    .filter-tabs button {
      height: 38px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-tabs button.active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    /* Dropdown-Filter */
    .dropdowns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .dropdowns select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 2px 4px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    /* Markenkarten */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .card:hover { border-color: var(--accent-2); }
    .card:active { transform: scale(0.985); }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.25;
    }

    .badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge.boycott { background: var(--red-soft); color: var(--red); }
    .badge.caution { background: var(--amber-soft); color: var(--amber); }
    .badge.safe { background: var(--accent-soft); color: var(--accent-text); }

    .card-info {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .tag {
      background: var(--surface-2);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .alt-bar {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-text);
      background: var(--accent-soft);
      padding: 6px 10px;
      border-radius: 10px;
    }

    .empty {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .more-area {
      text-align: center;
      margin-top: 18px;
    }

    #loadMoreBtn {
      height: 44px;
      padding: 0 24px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    /* Dialog-Fenster */
    dialog {
      width: min(540px, calc(100vw - 24px));
      border: 0;
